[project]
name = "goes-signatures-flood"
version = "0.1.0"
description = "GOES-16/19 spectral signatures for flood event detection across CONUS"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "jupyter",
    "ipykernel",
    "pyarrow",
    "geopandas",
    "folium",
    "mapclassify",
    "boto3",
    "tqdm",
    "xarray",
    "netcdf4",
    "rioxarray",
    "rasterio",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
